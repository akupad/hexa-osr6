<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexa 排版与折叠</title><style>
:root{--bg:#0e131e;--bg2:#151c29;--card:#19212f;--line:#27324a;--tx:#e7edf8;--mut:#8a9ab3;--acc:#5ba7ff;--amber:#e2b04a;--violet:#a98bff;--red:#e06c6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(14,19,30,.97);border-bottom:1px solid var(--line);padding:12px 18px}
header .title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600}
.meta{color:var(--mut);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
#q{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;min-width:300px}
.tools button{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.tools button:hover{border-color:var(--acc);color:var(--acc)}
.chk{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
main{display:grid;grid-template-columns:200px 1fr;align-items:start}
nav{position:sticky;top:112px;max-height:calc(100vh - 120px);overflow:auto;padding:14px 10px;border-right:1px solid var(--line)}
nav a{display:flex;gap:8px;padding:6px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:13px}
nav a:hover{background:var(--bg2)}
nav a.active{background:#1d2b44;color:var(--acc)}
nav a span:last-child{color:var(--mut);font-size:11px}
#content{padding:16px 20px 90px}
.page{margin-bottom:24px}
.page h2{font-size:15px;margin:0 0 10px}
.page h2 em{font-style:normal;color:var(--mut);font-size:12px;margin-left:8px}
.tree{display:flex;flex-direction:column;gap:4px}
.node.card>.head{background:var(--card);border:1px solid var(--line);border-radius:10px}
.node.fold>.head,.node.expander>.head{background:#1e1a12;border:1px solid #3b3222;border-radius:8px}
.node.expander>.head{background:#171c2c;border-color:#2c3a5c}
.head{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;user-select:none}
.head:hover{border-color:var(--acc)}
.caret{color:var(--mut);transition:transform .12s;display:inline-block;font-size:11px}
.caret.open{transform:rotate(90deg);color:var(--acc)}
.ttl{font-weight:600;font-size:13px;flex:1;min-width:120px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:0 7px;white-space:nowrap}
.tag.warn{color:var(--amber);border-color:#57451f}
.tag.ok{color:#5f9f7c;border-color:#284a38}
.tag.name{color:var(--violet);border-color:#3d3263}
.tag.ln{color:var(--acc);border-color:#24405f}
.tag.hide{color:var(--red);border-color:#5a2b2b}
.body{padding:4px 0 4px 18px;border-left:1px solid var(--line);margin-left:12px;display:flex;flex-direction:column;gap:4px}
.body.closed{display:none}
.leaf{display:flex;gap:8px;align-items:center;padding:3px 8px;border-left:2px solid transparent;border-radius:5px;font-size:13px}
.node.hidden .leaf{border-left-color:var(--red);opacity:.85}
.node.label .leaf{color:#bcc9dd}
.node.label .leaf .ttl,.node.hidden .leaf .ttl{font-weight:400}
body.compact .head{padding:4px 8px}
body.compact .leaf{padding:1px 6px;font-size:12px}
body.compact #content{padding:10px 14px 60px}
footer{color:var(--mut);font-size:12px;padding:0 20px 40px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3550;border-radius:6px}
::-webkit-scrollbar-track{background:#121826}
</style></head><body>
<header><div class="title"><h1>Hexa 排版与折叠</h1><span id="meta" class="meta"></span></div>
<div class="tools"><input id="q" placeholder="搜页面 / 卡片 / 控件名 / 行号"><button id="expandAll">全部展开</button><button id="foldAll">按默认收起</button><label class="chk"><input type="checkbox" id="onlyFolded">只看有折叠的</label><label class="chk"><input type="checkbox" id="compact">紧凑</label></div></header>
<main><nav id="nav"></nav><section id="content"></section></main>
<footer>数据直接从 Views/*.xaml 解析生成；改完界面后重跑 tools\layout\build-layout.mjs 即可刷新。行号可用来指位置。</footer>

"line":965},{"kind":"label","title":"0%","name":"ScreenScoreLabel","line":967},{"kind":"label","title":"正常","name":"ScreenVerdictText","line":982},{"kind":"label","title":"判定线：—","name":"ScreenThresholdHint","line":985},{"kind":"label","title":"⚙ 跟着画面里的动作走","name":"","line":1001},{"kind":"label","title":"没在动","name":"ScreenFollowStateLabel","line":1003},{"kind":"label","title":"这条信号要真驱动设备，得先在「游戏伴随」里勾上「画面同步」（或点下面的一键按钮）。","name":"ScreenFollowSourceNote","line":1007},{"kind":"label","title":"—","name":"ScreenFollowStatusText","line":1010},{"kind":"label","title":"相位锁定","name":"","line":1018},{"kind":"label","title":"0.35","name":"ScreenFollowLockLabel","line":1025},{"kind":"label","title":"🧠 识别模型（本地 · 判断画面内容）","name":"","line":1038},{"kind":"label","title":"模型档位","name":"","line":1045},{"kind":"label","title":"中（44MB，推荐）：自报准确率 98.06% · 实测每帧 13–20ms","name":"ScreenModelTierHint","line":1054},{"kind":"label","title":"没下载（中档 44MB）","name":"ScreenModelStatusText","line":1056},{"kind":"label","title":"下载模型","name":"ScreenModelDownloadBtn","line":1062},{"kind":"label","title":"删除模型","name":"ScreenModelDeleteBtn","line":1066},{"kind":"label","title":"🧍 姿态模型（定位画面里的运动主体）","name":"","line":1079},{"kind":"label","title":"没下载（13MB）","name":"ScreenPoseStatusText","line":1081},{"kind":"label","title":"用姿态定位运动主体（需先下载模型）","name":"","line":1085},{"kind":"label","title":"下载姿态模型","name":"ScreenPoseDownloadBtn","line":1091},{"kind":"label","title":"删除","name":"ScreenPoseDeleteBtn","line":1095}]}]},{"kind":"card","title":"🌬 氛围微动（可选）","name":"","line":1115,"collapsed":false,"controls":2,"children":[{"kind":"label","title":"🌬 氛围微动（可选）","name":"","line":1117},{"kind":"label","title":"在脚本播放、游戏桥这些精确动作之上，再叠一层很轻的「呼吸感」：只让次要轴轻轻摆，主轴一动不动。默认关，声音停了就停。","name":"","line":1118},{"kind":"label","title":"开启氛围微动（只动次要轴）","name":"","line":1122},{"kind":"label","title":"摆动幅度","name":"","line":1130},{"kind":"label","title":"±12%","name":"AmbientOverlayLabel","line":1134}]},{"kind":"card","title":"🔀 多输出","name":"FanoutCard","line":1141,"collapsed":true,"controls":2,"children":[{"kind":"label","title":"🔀 多输出","name":"","line":1149},{"kind":"label","title":"开启多输出","name":"FanoutToggleBtn","line":1153},{"kind":"label","title":"目标（一行一个）：udp://127.0.0.1:8000 或 ws://127.0.0.1:8581/ws","name":"","line":1158},{"kind":"label","title":"各目标状态：","name":"","line":1164},{"kind":"label","title":"（还没配置目标）","name":"FanoutStatusText","line":1166}]},{"kind":"label","title":"一键停止（全域急停：这条链路上的一切都停）","name":"","line":1182},{"kind":"label","title":"⛔ 全部停止","name":"StopBtn","line":1187},{"kind":"hidden","title":"StopHintText","name":"StopHintText","line":1192}]}]}
;</script><script>
(function(){
var L = window.LAYOUT || { pages: [] };
var pages = L.pages;
var meta = document.getElementById('meta');
var nav = document.getElementById('nav');
var content = document.getElementById('content');
var q = document.getElementById('q');
var onlyFolded = document.getElementById('onlyFolded');
var compact = document.getElementById('compact');
var openState = {};
var keySeq = 0;

function isFold(n){return n==='card'||n==='fold'||n==='expander';}
function walk(nodes,fn){nodes.forEach(function(n){fn(n);if(n.children&&n.children.length)walk(n.children,fn);});}
var totalCards=0,totalFolds=0,totalHidden=0;
pages.forEach(function(p){walk(p.sections,function(n){if(n.kind==='card')totalCards++;if(n.kind==='fold'||n.kind==='expander')totalFolds++;if(n.kind==='hidden')totalHidden++;});});
meta.textContent = pages.length+' 个页面 · '+totalCards+' 张卡 · '+totalFolds+' 处折叠 · '+totalHidden+' 处条件隐藏 · 生成于 '+L.generated;

function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});}

function matches(n,kw){
  if(!kw) return true;
  var blob=((n.title||'')+' '+(n.name||'')+' L'+n.line).toLowerCase();
  if(blob.indexOf(kw)>=0) return true;
  var kids=n.children||[];
  for(var i=0;i<kids.length;i++){if(matches(kids[i],kw))return true;}
  return false;
}

function renderNodes(nodes,host,kw,depth,parentTitle){
  nodes.forEach(function(n){
    if(!matches(n,kw)) return;
    if((n.kind==='label'||n.kind==='hidden') && parentTitle && n.title===parentTitle) return;
    var el=document.createElement('div');
    el.className='node '+n.kind+(depth?' d'+Math.min(depth,4):'');
    var key='k'+(keySeq++);
    el.dataset.key=key;
    if(isFold(n.kind)){
      var isOpen = openState.hasOwnProperty(key) ? openState[key] : true;
      var head=document.createElement('div');
      head.className='head';
      var badge = n.kind==='card' ? '卡片' : (n.kind==='expander' ? 'Expander' : '折叠');
      var stateTxt = n.collapsed ? '默认收起' : '默认展开';
      head.innerHTML='<span class="caret'+(isOpen?' open':'')+'">▸</span>'
        +'<span class="ttl">'+esc(n.title)+'</span>'
        +'<span class="tag">'+badge+'</span>'
        +'<span class="tag '+(n.collapsed?'warn':'ok')+'">'+stateTxt+'</span>'
        +(n.name?'<span class="tag name">'+esc(n.name)+'</span>':'')
        +'<span class="tag ln">L'+n.line+'</span>'
        +(n.controls?'<span class="tag">'+n.controls+' 控件</span>':'');
      var body=document.createElement('div');
      body.className='body'+(isOpen?'':' closed');
      renderNodes(n.children||[],body,kw,depth+1,n.title);
      head.onclick=function(){
        var open=!body.classList.contains('closed');
        if(open){body.classList.add('closed');}else{body.classList.remove('closed');}
        openState[key]=!open;
        head.querySelector('.caret').classList.toggle('open',!open);
      };
      el.appendChild(head); el.appendChild(body);
    } else {
      var mark = n.kind==='hidden' ? '<span class="tag hide">条件隐藏</span>' : '';
      el.innerHTML='<div class="leaf"><span class="ttl">'+esc(n.title)+'</span>'+mark+'<span class="tag ln">L'+n.line+'</span></div>';
    }
    host.appendChild(el);
  });
}

function render(){
  keySeq=0;
  var kw=(q.value||'').trim().toLowerCase();
  var only=onlyFolded.checked;
  nav.innerHTML=''; content.innerHTML='';
  var shown=0;
  pages.forEach(function(p,pi){
    if(only){var hasFold=false;walk(p.sections,function(n){if(n.kind==='fold'||n.kind==='expander')hasFold=true;});if(!hasFold)return;}
    if(kw && !p.sections.some(function(s){return matches(s,kw);}) && p.page.toLowerCase().indexOf(kw)<0) return;
    shown++;
    var a=document.createElement('a');
    a.href='#p'+(pi+1);
    a.innerHTML='<span style="flex:1">'+esc(p.page)+'</span><span>'+p.sections.filter(function(s){return s.kind==='card';}).length+'</span>';
    nav.appendChild(a);
    var sec=document.createElement('div'); sec.className='page'; sec.id='p'+(pi+1);
    var h=document.createElement('h2');
    h.innerHTML=esc(p.page)+' <em>'+esc(p.file)+'</em>';
    sec.appendChild(h);
    var box=document.createElement('div'); box.className='tree';
    renderNodes(p.sections,box,kw,0);
    sec.appendChild(box);
    content.appendChild(sec);
  });
  if(!shown) content.innerHTML='<div class="empty">没有匹配的内容</div>';
}

document.getElementById('expandAll').onclick=function(){openState={};render();};
document.getElementById('foldAll').onclick=function(){
  var i=0; openState={};
  var apply=function(nodes){nodes.forEach(function(n){if(isFold(n.kind)){openState['k'+(i)] = !n.collapsed; i++;} if(n.children&&n.children.length)apply(n.children);});};
  pages.forEach(function(p){apply(p.sections);});
  keySeq=0; render();
};
q.addEventListener('input',render);
onlyFolded.addEventListener('change',render);
compact.addEventListener('change',function(){document.body.classList.toggle('compact',compact.checked);});
nav.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;[].forEach.call(nav.querySelectorAll('a'),function(x){x.classList.remove('active');});a.classList.add('active');});
render();
})();
</script></body></html>
